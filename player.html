<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>VSL Player</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #000; overflow: hidden;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
  }
  #stage {
    position: relative; width: 100vw; height: 100vh;
    background: #000; overflow: hidden; user-select: none;
    display: flex; align-items: center; justify-content: center;
  }
  video {
    width: 100%; height: 100%; object-fit: contain; background: #000;
    display: block;
  }
  #clickLayer {
    position: absolute; inset: 0; cursor: pointer; z-index: 5;
  }
  #muteHint {
    position: absolute; top: 16px; left: 50%; transform: translateX(-50%);
    background: rgba(0,0,0,0.65); color: #fff; padding: 8px 16px;
    border-radius: 20px; font-size: 13px; display: flex; align-items: center; gap: 8px;
    z-index: 20; opacity: 1; transition: opacity 0.5s ease; pointer-events: none;
    white-space: nowrap;
  }
  #muteHint.hidden { opacity: 0; }
  #muteHint svg { width: 16px; height: 16px; flex-shrink: 0; }
  #centerPlay {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 74px; height: 74px; border-radius: 50%;
    background: rgba(0,0,0,0.55); display: flex; align-items: center; justify-content: center;
    z-index: 15; transition: opacity 0.2s ease, transform 0.15s ease; cursor: pointer;
  }
  #centerPlay:hover { transform: translate(-50%, -50%) scale(1.06); }
  #centerPlay svg { width: 30px; height: 30px; margin-left: 4px; }
  #centerPlay.hide { opacity: 0; pointer-events: none; }
  #progressWrap {
    position: absolute; left: 0; right: 0; bottom: 0; height: 26px;
    display: flex; align-items: flex-end; z-index: 25; padding: 0 0 6px 0;
    opacity: 1; transition: opacity 0.3s ease;
  }
  #progressTrack {
    position: relative; height: 5px; width: 100%; margin: 0 10px;
    background: rgba(255,255,255,0.28); border-radius: 3px; cursor: pointer;
  }
  #progressFill {
    position: absolute; left: 0; top: 0; bottom: 0; width: 0%;
    background: #2563eb; border-radius: 3px;
  }
  #progressHandle {
    position: absolute; top: 50%; width: 12px; height: 12px; border-radius: 50%;
    background: #fff; transform: translate(-50%, -50%); left: 0%;
    box-shadow: 0 0 3px rgba(0,0,0,0.5);
  }
  #ctaBtn {
    position: absolute; left: 50%; bottom: 46px; transform: translateX(-50%) translateY(20px);
    z-index: 30; padding: 14px 28px; border-radius: 8px; border: none;
    background: #2563eb; color: #fff; font-size: 16px; font-weight: 700;
    cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.35); text-decoration: none;
    opacity: 0; pointer-events: none; transition: opacity 0.35s ease, transform 0.35s ease;
    max-width: 88%; text-align: center;
  }
  #ctaBtn.show { opacity: 1; pointer-events: auto; transform: translateX(-50%) translateY(0); }
  #ctaBtn .sub { font-size: 12px; font-weight: 400; opacity: 0.9; }
  #ctaBtn:active { transform: translateX(-50%) translateY(0) scale(0.97); }
</style>
</head>
<body>
<div id="stage">
  <video id="video" playsinline muted></video>
  <div id="clickLayer"></div>

  <div id="muteHint">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M11 5 6 9H2v6h4l5 4V5z"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/>
    </svg>
    <span id="muteHintText">Toque para ativar o som</span>
  </div>

  <div id="centerPlay">
    <svg viewBox="0 0 24 24" fill="#fff"><path d="M8 5v14l11-7z"/></svg>
  </div>

  <a id="ctaBtn" target="_blank" rel="noopener noreferrer">
    <span id="ctaText">Comprar agora</span>
    <span class="sub" id="ctaSub" style="display:none;"></span>
  </a>

  <div id="progressWrap">
    <div id="progressTrack">
      <div id="progressFill"></div>
      <div id="progressHandle"></div>
    </div>
  </div>
</div>

<script>
(function () {
  function safeHttpUrl(u) {
    if (!u) return '';
    try {
      const parsed = new URL(u, window.location.href);
      return (parsed.protocol === 'http:' || parsed.protocol === 'https:') ? parsed.href : '';
    } catch (e) { return ''; }
  }

  const qs = new URLSearchParams(window.location.search);
  const cfg = {
    v: qs.get('v') || '',
    poster: qs.get('poster') || '',
    ctaUrl: safeHttpUrl(qs.get('cta_url') || ''),
    ctaText: qs.get('cta_text') || 'Comprar agora',
    ctaTime: parseFloat(qs.get('cta_time')) || 0,
    barColor: qs.get('bar_color') || '#2563eb',
    ctaColor: qs.get('cta_color') || '#2563eb',
    ctaSub: qs.get('cta_sub') || '',
    muteText: qs.get('mute_text') || 'Toque para ativar o som',
    autoplay: qs.get('autoplay') !== '0'
  };

  const video = document.getElementById('video');
  const clickLayer = document.getElementById('clickLayer');
  const centerPlay = document.getElementById('centerPlay');
  const muteHint = document.getElementById('muteHint');
  const muteHintText = document.getElementById('muteHintText');
  const progressTrack = document.getElementById('progressTrack');
  const progressFill = document.getElementById('progressFill');
  const progressHandle = document.getElementById('progressHandle');
  const ctaBtn = document.getElementById('ctaBtn');
  const ctaText = document.getElementById('ctaText');
  const ctaSub = document.getElementById('ctaSub');

  if (cfg.v) video.src = cfg.v;
  if (cfg.poster) video.poster = cfg.poster;

  progressFill.style.background = cfg.barColor;
  progressHandle.style.background = '#ffffff';
  ctaBtn.style.background = cfg.ctaColor;
  ctaText.textContent = cfg.ctaText;
  muteHintText.textContent = cfg.muteText;
  if (cfg.ctaSub) {
    ctaSub.textContent = cfg.ctaSub;
    ctaSub.style.display = 'block';
  }
  if (cfg.ctaUrl) ctaBtn.href = cfg.ctaUrl;

  let ctaShown = false;
  let userMuted = true;

  function updatePlayIcon() {
    centerPlay.classList.toggle('hide', !video.paused);
  }

  function tryAutoplay() {
    if (!cfg.autoplay) { updatePlayIcon(); return; }
    video.muted = true;
    userMuted = true;
    const p = video.play();
    if (p && p.catch) p.catch(() => { updatePlayIcon(); });
  }

  video.addEventListener('loadedmetadata', () => {
    tryAutoplay();
  });
  video.addEventListener('play', updatePlayIcon);
  video.addEventListener('pause', updatePlayIcon);

  setTimeout(() => {
    muteHint.classList.add('hidden');
  }, 3000);

  function togglePlay() {
    if (video.paused) video.play(); else video.pause();
  }

  function unmute() {
    if (userMuted) {
      video.muted = false;
      userMuted = false;
      muteHint.classList.add('hidden');
    }
  }

  clickLayer.addEventListener('click', () => {
    if (userMuted) {
      unmute();
      if (video.paused) video.play();
    } else {
      togglePlay();
    }
  });

  centerPlay.addEventListener('click', (e) => {
    e.stopPropagation();
    unmute();
    video.play();
  });

  video.addEventListener('timeupdate', () => {
    if (video.duration) {
      const pct = (video.currentTime / video.duration) * 100;
      progressFill.style.width = pct + '%';
      progressHandle.style.left = pct + '%';
    }
    if (cfg.ctaUrl && !ctaShown && video.currentTime >= cfg.ctaTime) {
      ctaShown = true;
      ctaBtn.classList.add('show');
    }
  });

  let seeking = false;
  function seekFromEvent(e) {
    const rect = progressTrack.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    let pct = (clientX - rect.left) / rect.width;
    pct = Math.min(1, Math.max(0, pct));
    if (video.duration) video.currentTime = pct * video.duration;
  }
  progressTrack.addEventListener('mousedown', (e) => {
    seeking = true; seekFromEvent(e); e.stopPropagation();
  });
  window.addEventListener('mousemove', (e) => { if (seeking) seekFromEvent(e); });
  window.addEventListener('mouseup', () => { seeking = false; });
  progressTrack.addEventListener('touchstart', (e) => { seeking = true; seekFromEvent(e); e.stopPropagation(); }, {passive: true});
  progressTrack.addEventListener('touchmove', (e) => { if (seeking) seekFromEvent(e); }, {passive: true});
  progressTrack.addEventListener('touchend', () => { seeking = false; });

  document.addEventListener('keydown', (e) => {
    if (e.code === 'Space') {
      e.preventDefault();
      togglePlay();
    } else if (e.code === 'ArrowRight') {
      video.currentTime = Math.min(video.duration || Infinity, video.currentTime + 10);
    } else if (e.code === 'ArrowLeft') {
      video.currentTime = Math.max(0, video.currentTime - 10);
    }
  });

  updatePlayIcon();
})();
</script>
</body>
</html>
